spring.application.name=sistema-escolar2

# Informar ao SpringBoot onde está o Banco de Dados
spring.datasource.url=jdbc:postgresql://localhost:5432/escola


#  Usuario configurado no Postgres
spring.datasource.username=postgres

#  Senha REAL do seu Postgres
spring.datasource.password=postgres

# Permitir que o Hibernete crie e atualize tabelas durante o desenvolvimento
spring.jpa.hibernate.ddl-auto=update

# Exibe comandos SQL no terminal para fins didáticos
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true